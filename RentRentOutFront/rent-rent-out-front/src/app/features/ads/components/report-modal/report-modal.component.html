<div class="modal-backdrop" (click)="close()"></div>

<div class="modal">
  <button class="close-btn" (click)="close()">&times;</button>
  <h3 class="modal-title">{{ 'report.title' | translate }}</h3>
  <p class="modal-sub">{{ 'report.subtitle' | translate }}</p>

  <div class="reason-list">
    <label *ngFor="let r of reasons" class="reason-item" [class.selected]="selectedReason === r.value">
      <input type="radio" name="reason" [value]="r.value" [(ngModel)]="selectedReason">
      {{ r.key | translate }}
    </label>
  </div>

  <textarea
    class="note-input"
    rows="3"
    maxlength="500"
    [placeholder]="'report.note_placeholder' | translate"
    [(ngModel)]="note">
  </textarea>

  <div class="modal-actions">
    <button class="btn-cancel" (click)="close()">{{ 'report.cancel' | translate }}</button>
    <button class="btn-submit"
            [disabled]="!selectedReason || submitting"
            (click)="submit()">
      {{ submitting ? ('report.submitting' | translate) : ('report.submit' | translate) }}
    </button>
  </div>
</div>
