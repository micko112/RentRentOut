<div class="sidebar-wrapper">

  <!-- HEADER -->
  <div class="sidebar-header">
    <h2 class="sidebar-title">
      <span class="material-icons">tune</span>
      {{ 'common.filters' | translate }}
    </h2>
    <button class="btn-clear-header" *ngIf="activeFilterCount > 0" (click)="clearAll()">
      {{ 'ads.filters.clear_all' | translate }}
    </button>
  </div>

  <div class="sidebar-content">

    <!-- 1. KLJUČNA REČ -->
    <section class="filter-group">
      <label class="group-label">{{ 'ads.filters.search' | translate }}</label>
      <div class="search-input-wrap">
        <span class="material-icons si-icon">search</span>
        <input type="text" class="search-text-input" [placeholder]="'ads.filters.search_placeholder' | translate"
               [(ngModel)]="filters.keyword" name="keyword" (ngModelChange)="onFilterChange()" />
        <button class="si-clear" *ngIf="filters.keyword" (click)="filters.keyword = ''">
          <span class="material-icons">close</span>
        </button>
      </div>
    </section>

    <!-- 2. KATEGORIJA -->
    <section class="filter-group">
      <label class="group-label">{{ 'ads.filters.category' | translate }}</label>
      <div class="select-wrap">
        <span class="material-icons select-icon">category</span>
        <select class="custom-select" [(ngModel)]="filters.categoryId" name="categoryId" (ngModelChange)="onFilterChange()">
          <option [ngValue]="undefined">{{ 'ads.filters.all_categories' | translate }}</option>
          <optgroup *ngFor="let parent of parentCategories" [label]="parent.name">
            <option [ngValue]="parent.id">{{ parent.name }} ({{ 'ads.filters.all' | translate }})</option>
            <ng-container *ngFor="let child of getChildren(parent.id)">
              <option [ngValue]="child.id">{{ child.name }}</option>
              <option *ngFor="let grandchild of getChildren(child.id)" [ngValue]="grandchild.id">— {{ grandchild.name }}</option>
            </ng-container>
          </optgroup>
        </select>
      </div>
    </section>

    <!-- 3. LOKACIJA -->
    <section class="filter-group">
      <label class="group-label">{{ 'ads.filters.city' | translate }}</label>
      <app-city-picker
        #cityPicker
        [locations]="locations"
        [allowCityOnly]="true"
        [placeholder]="'ads.filters.all_cities' | translate"
        [initialLocationId]="initialLocationId"
        [priorityCity]="userCity"
        (selectionChange)="onCityChange($event)">
      </app-city-picker>
    </section>

    <!-- 4. TIP CENE -->
    <section class="filter-group">
      <label class="group-label">{{ 'ads.filters.rent_type' | translate }}</label>
      <div class="interval-chips">
        <button *ngFor="let opt of intervalOptions"
                class="interval-chip"
                [class.active]="filters.priceInterval === opt.value"
                (click)="toggleInterval(opt.value)">
          {{ opt.i18nKey | translate }}
        </button>
      </div>
    </section>

    <!-- 5. CENA -->
    <section class="filter-group">
      <label class="group-label">{{ 'ads.filters.price_range' | translate }}</label>
      <div class="price-row">
        <div class="price-input-wrap">
          <input type="number" class="price-input" [placeholder]="'ads.filters.from' | translate" [(ngModel)]="filters.minPrice" name="minPrice" min="0" (ngModelChange)="onFilterChange()" />
        </div>
        <span class="price-dash">—</span>
        <div class="price-input-wrap">
          <input type="number" class="price-input" [placeholder]="'ads.filters.to' | translate" [(ngModel)]="filters.maxPrice" name="maxPrice" min="0" (ngModelChange)="onFilterChange()" />
        </div>
      </div>
    </section>

    <!-- 6. AKCIJE -->
    <div class="sidebar-actions">
      <button class="btn-apply" (click)="onSubmit()">
        <span class="material-icons">search</span>
        {{ 'ads.filters.show_ads' | translate }}
        <span class="filter-badge" *ngIf="previewCount !== null">{{ previewCount }}</span>
      </button>
    </div>

  </div>
</div>
