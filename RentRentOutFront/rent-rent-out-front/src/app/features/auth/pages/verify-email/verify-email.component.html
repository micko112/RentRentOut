<div class="verify-container">
  <div class="card">
    <h2>{{ 'verifyEmail.title' | translate }}</h2>
    <p class="status" [ngClass]="status">{{ message }}</p>

    <div class="actions">
      <a routerLink="/login" class="btn" *ngIf="status === 'success'">{{ 'verifyEmail.login' | translate }}</a>
      <a routerLink="/register" class="btn" *ngIf="status === 'error'">{{ 'verifyEmail.register' | translate }}</a>
    </div>
  </div>
</div>
