<!-- Backdrop (mobile only) -->
<div class="support-backdrop" *ngIf="isOpen" (click)="close()"></div>

<!-- Floating bubble -->
<button class="support-fab" (click)="toggle()" [attr.aria-label]="isOpen ? ('support.close_aria' | translate) : ('support.open_aria' | translate)">
  <span class="material-icons" *ngIf="!isOpen">chat</span>
  <span class="material-icons" *ngIf="isOpen">keyboard_arrow_down</span>
</button>

<!-- Floater panel -->
<div class="support-panel" *ngIf="isOpen">

  <!-- Drag handle (mobile only) -->
  <div class="sheet-handle"></div>

  <!-- Header -->
  <header class="panel-header">
    <div class="header-left">
      <div class="bot-avatar" aria-hidden="true">
        <span class="material-symbols-outlined">smart_toy</span>
        <span class="ai-badge">AI</span>
      </div>
      <div class="header-title">
        <span class="bot-name">{{ 'support.bot_name' | translate }}</span>
        <span class="bot-status">
          <span class="status-dot"></span>
          {{ 'support.online' | translate }}
        </span>
      </div>
    </div>
    <button class="close-btn" (click)="close()" [attr.aria-label]="'support.close' | translate">
      <span class="material-icons">close</span>
    </button>
  </header>

  <!-- Chat -->
  <div #messagesList class="messages-list">
    <div *ngIf="!hasMessages" class="chat-intro">
      <div class="bot-avatar lg" aria-hidden="true">
        <span class="material-symbols-outlined">smart_toy</span>
      </div>
      <h4>{{ 'support.intro_hello' | translate }}</h4>
      <p>{{ 'support.intro_text' | translate }}</p>
    </div>

    <div *ngFor="let m of messages; trackBy: trackByIndex"
         class="msg"
         [class.msg-user]="m.role === 'user'"
         [class.msg-bot]="m.role === 'bot'">
      <div class="msg-bubble" [innerHTML]="m.role === 'bot' ? (m.text | markdown) : m.text"></div>
    </div>

    <div *ngIf="loading" class="msg msg-bot">
      <div class="msg-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <textarea
      #inputRef
      [(ngModel)]="draft"
      (keydown)="onInputKeydown($event)"
      [placeholder]="'support.placeholder' | translate"
      rows="1"
      [disabled]="loading"></textarea>
    <button class="send-btn" (click)="send()" [disabled]="!draft.trim() || loading" [attr.aria-label]="'support.send' | translate">
      <span class="material-icons">send</span>
    </button>
  </div>
</div>
