<header class="site-header">
  <div class="container header-content">

    <!-- LOGO -->
    <div class="logo">
      <a routerLink="/">
        <img src="assets/images/Izdajem%20Iznajmljujem.png" class="logo-img" alt="logo"/>
      </a>
    </div>

    <!-- DESKTOP: search bar -->
    <div class="search-bar">
      <img src="assets/images/icons8-search-50.png" class="search-icon" alt="search"/>
      <input type="text" [placeholder]="'header.search_placeholder' | translate"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()">
      <div class="search-filter-sep"></div>
      <button class="search-filter-btn" (click)="triggerMobileFilter()" [title]="'common.filters' | translate">
        <span class="material-icons">tune</span>
      </button>
      <button class="search-btn" (click)="onSearch()">{{ 'common.search' | translate }}</button>
    </div>

    <!-- DESKTOP: user actions -->
    <div class="user-actions" *ngIf="currentUser$ | async as user; else notLoggedIn">
      <app-language-switcher></app-language-switcher>
      <button class="btn-post-ad" (click)="createAd()">{{ 'header.post_ad' | translate }}</button>
      <button *ngIf="user.role === 'ROLE_ADMIN'" class="btn-admin" (click)="adminPanel()">{{ 'header.admin_panel' | translate }}</button>
      <button class="btn-profile" (click)="myProfile()">{{ 'header.my_profile' | translate }}</button>
      <button class="auth-button" (click)="logout()">{{ 'header.logout' | translate }}</button>
    </div>
    <ng-template #notLoggedIn>
      <div class="user-actions">
        <app-language-switcher></app-language-switcher>
        <button class="btn-post-ad" (click)="createAd()">{{ 'header.post_ad' | translate }}</button>
        <button class="auth-button" (click)="login()">{{ 'header.login' | translate }}</button>
        <button class="auth-button" (click)="register()">{{ 'header.register' | translate }}</button>
      </div>
    </ng-template>

    <!-- MOBILE: ikonice desno (≤768px) -->
    <div class="mobile-actions">
      <app-language-switcher class="mobile-lang-switcher"></app-language-switcher>
      <button class="mobile-icon-btn" (click)="navigateSaved()" [title]="'header.saved_ads' | translate">
        <span class="material-icons">bookmark_border</span>
      </button>
      <button class="mobile-icon-btn mobile-icon-btn--menu" (click)="openMobileMenuEvent.emit()" [title]="'common.menu' | translate">
        <span class="material-icons">menu</span>
      </button>
    </div>

  </div>
</header>
